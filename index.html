<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd23f">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrônomo de Regência</title>
<style>
:root{
  --bg:#fff4d6; --panel:#ffffff; --ink:#3b2a5a; --mute:#8a6fb0; --line:#3b2a5a;
  --c0:#4a4a68; --c1:#2f6bff; --c2:#19b86a; --c3:#ff4d6d; --prep:#1fb6ff; --sun:#ffd23f;
  --btn:#f4f0ff; --soft:#fffbea; --field:#ffffff; --onsun:#3b2a5a;
  --b1:#ffe08a; --b2:#bfe8ff; --b3:#ffc9d9; --b4:#c9f5d9;
}
:root[data-theme=dark]{
  --bg:#1c1530; --panel:#2a2145; --ink:#f3ecff; --mute:#b9a5e0; --line:#0d0919;
  --c0:#9aa0c9; --c1:#6c97ff; --c2:#2fd68a; --c3:#ff6b89; --prep:#4cc9ff;
  --btn:#3a2f5e; --soft:#33294f; --field:#1c1530; --onsun:#3b2a5a;
  --b1:#2b2250; --b2:#1f2a52; --b3:#3a2147; --b4:#1d3a3f;
}
:root[data-bgmode=custom] body{background-image:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Fredoka","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:16px;gap:16px;position:relative;overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 18%,var(--b1) 0 60px,transparent 61px),radial-gradient(circle at 92% 8%,var(--b2) 0 80px,transparent 81px),radial-gradient(circle at 95% 95%,var(--b3) 0 90px,transparent 91px),radial-gradient(circle at 5% 90%,var(--b4) 0 70px,transparent 71px);
  background-attachment:fixed}
h1{font-size:1.9rem;margin:2px 0 0;font-weight:800;text-align:center;line-height:1.1}
h1 .r{color:var(--c3)} h1 .b{color:var(--c1)} h1 .g{color:var(--c2)}
h1 small{display:block;font-size:.95rem;font-weight:600;color:var(--mute);margin-top:2px}
#stage{width:min(92vw,520px);aspect-ratio:1/1;background:var(--panel);border:4px solid var(--line);border-radius:28px;box-shadow:0 7px 0 var(--line)}
svg{width:100%;height:100%;display:block}
.seg{fill:none;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:.1 2.2;opacity:.45}
.seg.on{stroke-width:2.1;stroke-dasharray:none;opacity:1}
.pt{stroke:#fff;stroke-width:.8}
.pt.hit{transform-box:fill-box;transform-origin:center;animation:hit .3s ease-out}
@keyframes hit{0%{transform:scale(1.7)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.num{font-size:5px;font-weight:800;fill:#fff;pointer-events:none}
.prep{stroke:var(--prep);stroke-width:1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.preptxt{font-size:4px;font-weight:700;fill:var(--prep)}
.panel{width:min(92vw,520px);background:var(--panel);border:4px solid var(--line);border-radius:28px;box-shadow:0 7px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:16px}
.sigs{display:flex;flex-wrap:wrap;gap:8px}
.sigs button{flex:1 1 30%;padding:8px 6px;border-radius:16px;border:3px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;font:inherit;font-weight:800;font-size:1.15rem;line-height:1.15;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.sigs button small{display:block;color:var(--mute);font-size:.72rem;font-weight:600}
.sigs button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.sigs button[aria-pressed=true]{background:var(--sun);color:var(--onsun)}
.sigs button[aria-pressed=true] small{color:var(--onsun)}
.tempo{display:flex;align-items:center;gap:10px}
.step{width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:var(--c2);color:#fff;font:inherit;font-size:2rem;font-weight:800;line-height:1;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 var(--line)}
#minus{background:var(--c3)}
.step:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
#bpmBox{flex:1;text-align:center}
#bpm{font-size:3.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--c1)}
#bpmLbl{color:var(--mute);font-size:.95rem;font-weight:600}
input[type=range]{width:100%;height:30px;accent-color:var(--c3);margin:6px 0 0}
.row{display:flex;gap:10px}
#play{flex:2;padding:14px;border-radius:20px;border:3px solid var(--line);background:var(--c2);color:#fff;font:inherit;font-weight:800;font-size:1.5rem;cursor:pointer;box-shadow:0 6px 0 var(--line)}
#play[aria-pressed=true]{background:var(--c3)}
#tap{flex:1;padding:14px;border-radius:20px;border:3px solid var(--line);background:var(--sun);color:var(--onsun);font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;box-shadow:0 6px 0 var(--line)}
#play:active,#tap:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
button:focus-visible,input:focus-visible{outline:4px solid var(--prep);outline-offset:3px}
.hint{color:var(--mute);font-size:.8rem;text-align:center;margin:0}
@media (prefers-reduced-motion: reduce){.pt.hit{animation:none}}
[hidden]{display:none!important}
#install{padding:10px 18px;border-radius:18px;border:3px solid var(--line);background:var(--c1);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 var(--line)}
#install:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.sigs button{position:relative}
.del{position:absolute;top:-9px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--c3);color:#fff;font-size:.7rem;line-height:19px;border:2px solid var(--line);text-align:center}
details#creator{border:3px dashed var(--line);border-radius:18px;padding:8px 12px;background:var(--soft)}
details#creator summary{font-weight:800;font-size:1.1rem;cursor:pointer}
.form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:.9rem}
.form input,.form select{font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--line);background:var(--field);color:var(--ink)}
#cAdd{padding:11px;border-radius:16px;border:3px solid var(--line);background:var(--c2);color:#fff;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;box-shadow:0 5px 0 var(--line)}
#cAdd:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.chars{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.chars span{flex:1 1 100%}
.chars button{width:54px;height:54px;border-radius:18px;border:3px solid var(--line);background:var(--btn);font-size:1.8rem;line-height:1;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.chars button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chars button[aria-pressed=true]{background:var(--sun)}
.credit{color:var(--mute);font-size:.9rem;font-weight:700;text-align:center;padding:4px 0 8px}
.tabs{display:flex;gap:8px;width:min(92vw,520px)}
.tabs button{flex:1;padding:10px 6px;border-radius:18px;border:3px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.tabs button[aria-pressed=true]{background:var(--sun);color:var(--onsun)}
.tabs button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chips,.grid{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mini{padding:8px 12px;border-radius:14px;border:3px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 3px 0 var(--line);touch-action:manipulation}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.mini[aria-pressed=true]{background:var(--sun);color:var(--onsun)}
.mini.big{min-width:54px;font-size:1.05rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:.9rem}
.opts select,#lib,textarea,#libName{font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--line);background:var(--field);color:var(--ink)}
textarea{width:100%;resize:vertical}
#lib{flex:1;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:14px;font-weight:700}
.checks label{display:flex;align-items:center;gap:6px}
.checks input{width:20px;height:20px;accent-color:var(--c2)}
hr{border:0;border-top:3px dashed var(--line);width:100%;margin:4px 0;opacity:.4}
.score{max-height:260px;overflow:auto;position:relative;display:flex;flex-wrap:wrap;gap:10px 14px;align-content:flex-start;padding:10px;border:3px solid var(--line);border-radius:18px;background:var(--soft)}
.score>.hint{width:100%}
.bar{display:flex;gap:4px;padding-right:10px;border-right:3px solid var(--line)}
.nt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;padding:5px 6px;border-radius:12px;background:var(--btn);border:2px solid transparent;font-weight:800;line-height:1.1;cursor:default;transition:transform .08s}
.nt b{font-size:1.15rem}
.nt small{font-size:.7rem;color:var(--mute);font-weight:700}
.nt.rest{opacity:.65}
.nt.now{background:var(--sun);color:var(--onsun);border-color:var(--line);transform:scale(1.12)}
.nt.now small{color:var(--onsun)}
.theme{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.theme>span{flex:1 1 100%}
.theme button,.theme label.pick{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--btn);font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation;padding:0;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.theme button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.theme button[aria-pressed=true]{background:var(--sun);color:var(--onsun)}
.theme .sw[aria-pressed=true]{outline:4px solid var(--prep);outline-offset:2px}
.theme .modes{display:flex;gap:8px;margin-right:6px}
.theme label.pick input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;cursor:pointer}
.theme .reset{width:auto;border-radius:16px;padding:0 12px;font:inherit;font-size:.95rem;font-weight:800;color:var(--ink)}
details#editor{border:3px dashed var(--line);border-radius:18px;padding:8px 12px;background:var(--soft)}
details#editor summary{font-weight:800;font-size:1.1rem;cursor:pointer}
.mini small{display:block;font-size:.65rem;color:var(--mute);font-weight:700;line-height:1}
.mini[aria-pressed=true] small{color:var(--onsun)}
.mini.big{line-height:1.1}
.score.edit .nt{cursor:pointer}
.score.edit .nt:hover{border-color:var(--c3)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;aspect-ratio:1/1;padding:0;border-radius:20px;border:3px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.card svg{width:100%;height:100%;display:block}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.card[aria-pressed=true]{background:var(--sun);color:var(--onsun)}
.card.now{outline:5px solid var(--prep);outline-offset:2px}
.card .ck{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:transparent;font-size:.8rem;line-height:18px;font-weight:800;text-align:center}
.card[aria-pressed=true] .ck{background:var(--c2);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--c2)}
</style>
</head>
<body>
<h1>🎵 <span class="r">Meu</span> <span class="b">Metrônomo</span> <span class="g">Maestro</span> 🎶<small>Siga a bolinha e aprenda a reger!</small></h1>
<div class="tabs" id="tabs">
  <button type="button" id="tabM" aria-pressed="true">🥁 Metrônomo</button>
  <button type="button" id="tabS" aria-pressed="false">🎼 Solfejo</button>
</div>

<div id="stage"><svg id="svg" viewBox="0 0 100 100" role="img" aria-label="Movimento de regência do compasso"></svg></div>

<div class="panel" id="scorePanel" hidden>
  <strong style="font-size:1.15rem">Escolha as figuras do ritmo 🎵</strong>
  <div class="cards" id="cards"></div>
  <p class="hint" id="cardHint"></p>
  <label class="chk" id="lSpeak"><input type="checkbox" id="oSpeak" checked> 🔊 Falar as sílabas (Tá, ti)</label>
</div>

<div class="panel">
  <div class="sigs" id="sigs"></div>

  <details id="creator">
    <summary>➕ Criar meu compasso</summary>
    <div class="form">
      <label>Quantos pulsos? <input type="number" id="cN" min="2" max="16" value="5"></label>
      <label>Como agrupar?
        <select id="cG">
          <option value="1">Cada pulso é um tempo (simples)</option>
          <option value="2">De 2 em 2</option>
          <option value="3">De 3 em 3 (composto)</option>
          <option value="4">De 4 em 4</option>
        </select>
      </label>
      <label>Ou grupos irregulares <input type="text" id="cT" placeholder="ex.: 3+2 ou 2+2+3"></label>
      <label>Nome (opcional) <input type="text" id="cName" placeholder="ex.: 5/4" maxlength="8"></label>
      <button id="cAdd" type="button">✨ Criar e usar</button>
      <p class="hint" id="cMsg"></p>
    </div>
  </details>

  <div class="chars" id="chars"></div>

  <div class="theme" id="theme">
    <span>Tema e cor do fundo 🎨</span>
    <div class="modes">
      <button type="button" id="mLight" aria-label="Tema claro" title="Claro">☀️</button>
      <button type="button" id="mDark" aria-label="Tema escuro" title="Escuro">🌙</button>
    </div>
    <div id="swatches" style="display:contents"></div>
    <label class="pick" title="Escolher outra cor" aria-label="Escolher outra cor">🌈<input type="color" id="bgPick" value="#fff4d6"></label>
    <button type="button" class="reset" id="bgReset">Padrão</button>
  </div>

  <div id="ctrl" style="display:flex;flex-direction:column;gap:16px">
  <div>
    <div class="tempo">
      <button class="step" id="minus" aria-label="Diminuir andamento">−</button>
      <div id="bpmBox"><div id="bpm">80</div><div id="bpmLbl">batidas por minuto 🥁</div></div>
      <button class="step" id="plus" aria-label="Aumentar andamento">+</button>
    </div>
    <input type="range" id="slider" min="30" max="240" value="80" aria-label="Andamento">
  </div>

  <div class="row">
    <button id="play" aria-pressed="false">▶ Vamos!</button>
    <button id="tap">👆 Tap</button>
  </div>
  <p class="hint">Dica: aperte Espaço para começar e parar ✨</p>
  </div>
</div>

<button id="install" hidden>📲 Instalar app</button>
<p class="hint" id="iosHint" hidden></p>

<footer class="credit">By Ranna Azevedo</footer>

<script>
/* Pontos (x,y) em grade 0–100, baseados nos diagramas. Cores: índice da cor de cada pulso. */
const PATTERNS = [
  {id:'2/4', name:'Binário simples',  pts:[[50,88],[50,20]], col:[0,1], accent:[0]},
  {id:'3/4', name:'Ternário simples', pts:[[30,88],[88,56],[34,20]], col:[0,1,2], accent:[0]},
  {id:'4/4', name:'Quaternário simples', pts:[[52,88],[10,64],[90,49],[56,20]], col:[0,1,2,3], accent:[0]},
  {id:'6/8', name:'Binário composto', pts:[[48,85],[29,75],[10,64],[74,55],[90,49],[57,25]], col:[0,0,0,1,1,1], accent:[0,3]},
  {id:'9/8', name:'Ternário composto', pts:[[45,85],[27,78],[10,69],[63,64],[76,60],[90,56],[74,32],[60,26],[46,20]], col:[0,0,0,1,1,1,2,2,2], accent:[0,3,6]},
  {id:'12/8', name:'Quaternário composto', pts:[[47,90],[58,88],[69,86],[29,80],[19,76],[10,72],[66,65],[78,62],[90,58],[25,39],[63,32],[44,20]], col:[0,0,0,1,1,1,2,2,2,3,3,3], accent:[0,3,6,9]}
];
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('svg');

let pat = PATTERNS[2], segs = [], pointEls = [], dot, bpm = 80;
let ctx = null, playing = false, queue = [], cur = null, nextTime = 0, nextBeat = 0, timer = null;

function el(name, attrs, parent){
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
const f = n => Math.round(n*10)/10;

function segPath(i){
  const n = pat.pts.length, P = pat.pts[i], Q = pat.pts[(i+1)%n];
  if (i === n-1){                       // último pulso: sobe (rebote) e desce para o 1
    const tx = P[0]+2, ty = 4;
    return `M${f(P[0])},${f(P[1])} C${f(P[0]-8)},${f(P[1]-6)} ${f(P[0]-6)},${ty} ${f(tx)},${ty} ` +
           `C${f(tx+9)},${ty} ${f(Q[0]+6)},${f((ty+Q[1])/2)} ${f(Q[0])},${f(Q[1])}`;
  }
  const mx = (P[0]+Q[0])/2, my = (P[1]+Q[1])/2;
  const dist = Math.hypot(Q[0]-P[0], Q[1]-P[1]);
  const vertical = Math.abs(Q[0]-P[0]) < 8;
  const cx = vertical ? mx + 34 : mx, cy = vertical ? my : my - dist*0.55;
  return `M${f(P[0])},${f(P[1])} Q${f(cx)},${f(cy)} ${f(Q[0])},${f(Q[1])}`;
}

function build(){
  svg.innerHTML = '';
  segs = []; pointEls = [];
  const n = pat.pts.length;
  // seta de preparação
  const p1 = pat.pts[0];
  el('line', {x1:p1[0]+7, y1:p1[1]-18, x2:p1[0]+7, y2:p1[1]+3, class:'prep'});
  el('path', {d:`M${p1[0]+5},${p1[1]-1} L${p1[0]+7},${p1[1]+3} L${p1[0]+9},${p1[1]-1}`, class:'prep'});
  const t = el('text', {x:p1[0]+10, y:p1[1]-14, class:'preptxt'}); t.textContent = 'Preparação';
  for (let i=0;i<n;i++){
    segs.push(el('path', {d:segPath(i), class:'seg', stroke:`var(--c${pat.col[i]})`}));
  }
  for (let i=0;i<n;i++){
    const [x,y] = pat.pts[i];
    pointEls.push(el('circle', {cx:x, cy:y, r:4.4, fill:`var(--c${pat.col[i]})`, class:'pt'}));
    const tx = el('text', {x:x, y:y+1.8, class:'num', 'text-anchor':'middle'}); tx.textContent = i+1;
  }
  dot = el('g', {id:'dot', transform:`translate(${p1[0]} ${p1[1]})`});
  drawChar(dot, charKind);
}

function buildSigs(){
  const box = $('sigs'); box.innerHTML = '';
  PATTERNS.concat(custom).forEach(p => {
    const b = document.createElement('button');
    b.innerHTML = `${p.id}<small>${p.name}</small>`;
    b.setAttribute('aria-pressed', p === pat);
    b.onclick = () => choose(p);
    if (p.custom){
      const d = document.createElement('span');
      d.className = 'del'; d.textContent = '✖'; d.setAttribute('role','button'); d.setAttribute('aria-label','Apagar compasso');
      d.onclick = e => { e.stopPropagation(); custom = custom.filter(c => c !== p); saveCustom(); if (pat === p) choose(PATTERNS[2]); else buildSigs(); };
      b.appendChild(d);
    }
    box.appendChild(b);
  });
}

/* ---------- Áudio ---------- */
function click(time, beat){
  const o = ctx.createOscillator(), g = ctx.createGain();
  const strong = beat === 0, group = pat.accent.includes(beat);
  o.frequency.value = strong ? 1250 : group ? 900 : 650;
  const peak = strong ? .9 : group ? .65 : .45;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(peak, time + .002);
  g.gain.exponentialRampToValueAtTime(.001, time + .06);
  o.connect(g).connect(ctx.destination);
  o.start(time); o.stop(time + .07);
}
function scheduler(){
  while (nextTime < ctx.currentTime + .12){
    const dur = 60 / bpm;
    if (scoreOn){ noteQueue.push({time: nextTime, p: tickN}); tickN++; }
    click(nextTime, nextBeat);
    queue.push({beat:nextBeat, time:nextTime, dur});
    nextTime += dur;
    nextBeat = (nextBeat + 1) % pat.pts.length;
  }
}
function start(){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  queue = []; cur = null; nextBeat = 0; nextTime = ctx.currentTime + .08;
  noteQueue = []; clearNow();
  scoreOn = view === 'solfa';
  tickN = scoreOn ? -pat.pts.length : 0;     // um compasso de contagem antes das figuras
  playing = true; scheduler(); timer = setInterval(scheduler, 25);
  $('play').textContent = '⏹ Parar'; $('play').setAttribute('aria-pressed', true);
}

/* ---------- Animação sincronizada com o relógio do áudio ---------- */
let lastOn = -1;
function frame(){
  if (playing){
    const now = ctx.currentTime;
    while (noteQueue.length && noteQueue[0].time <= now) showNow(noteQueue.shift());
    while (queue.length && queue[0].time <= now){
      cur = queue.shift();
      if (segs[cur.beat]){
        if (lastOn >= 0 && segs[lastOn]) segs[lastOn].classList.remove('on');
        segs[cur.beat].classList.add('on'); lastOn = cur.beat;
        const pe = pointEls[cur.beat];
        pe.classList.remove('hit'); void pe.getBoundingClientRect(); pe.classList.add('hit');
      }
    }
    if (cur && segs[cur.beat]){
      const path = segs[cur.beat];
      const prog = Math.min(1, Math.max(0, (now - cur.time) / cur.dur));
      const pt = path.getPointAtLength(prog * path.getTotalLength());
      dot.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    }
  }
  requestAnimationFrame(frame);
}

function hold(btn, delta){
  let t1, t2;
  const go = () => setBpm(bpm + delta);
  const end = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); go(); t1 = setTimeout(() => t2 = setInterval(go, 70), 400); });

}

document.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'TEXTAREA' || tg === 'SELECT' || (tg === 'INPUT' && e.target.type !== 'range')) return;
  if (tg === 'INPUT' && e.key.startsWith('Arrow')) return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? stop() : start(); }
  else if (e.key === 'ArrowRight') setBpm(bpm+1);

  else if (e.key === 'ArrowUp')    { e.preventDefault(); setBpm(bpm+5); }

/* sizes = tamanho de cada grupo, ex.: [1,1,1,1] (4/4), [3,3] (6/8), [3,2] (5/4) */
function gen(sizes, id, name, isCustom){
  const G = sizes.length, st = [];
  for (let g=0; g<G; g++){
    if (g === 0) st.push([G === 1 ? 40 : 50, 86]);
    else if (g === G-1) st.push([50, 22]);
    else {
      const M = G-2, right = G === 3 ? true : (g % 2 === 0);
      st.push([right ? 86 : 14, M === 1 ? 56 : 68 - (g-1) * (28/(M-1))]);
    }
  }
  const pts = [], col = [], accent = [];
  sizes.forEach((sz, g) => {
    accent.push(pts.length);
    const [x,y] = st[g];
    let dir = x > 55 ? 1 : -1, step = 9;
    if (sz > 1){
      const space = d => d > 0 ? 92 - x : x - 8;
      if (space(dir) < 9*(sz-1) && space(-dir) > space(dir)) dir = -dir;
      step = Math.min(9, space(dir)/(sz-1));
    }
    for (let k=0; k<sz; k++){
      pts.push([Math.round((x + dir*step*k)*10)/10, Math.round((y - 2.5*k)*10)/10]);
      col.push(g % 4);
    }
  });
  return {id, name, pts, col, accent, sizes, custom:!!isCustom};
}

const SETS = {
  2: [[2],[1,1],[1,.5,.5],[.5,.5,1],[.5,.5,.5,.5],[1,-1],[-1,1],[1.5,.5],[-1,.5,.5]],
  3: [[3],[1.5,.5,1],[1,1,1],[1,2],[1,-1,1],[2,.5,.5],[.5,.5,.5,.5,1],[1,.5,.5,1],[1,.5,.5,.5,.5]],

/* quanto vale um pulso do metrônomo, em semínimas (4/4 → 1, 6/8 → 0,5, 2/2 → 2) */
function pulseQ(p){
  const m = /\/(\d+)$/.exec(p.id);
  if (m && +m[1] > 0) return 4 / +m[1];
  return p.sizes ? (p.sizes.every(x => x === 1) ? 1 : .5) : 1;
}
function isCompound(p){ return pulseQ(p) === .5 && p.pts.length % 3 === 0 && (!p.sizes || p.sizes.every(x => x === 3)); }

/* compasso: quantos tempos principais e se as figuras (em semínimas) se aplicam */
function beatsInfo(){
  const comp = isCompound(pat);
  return {n: comp ? pat.pts.length / 3 : pat.pts.length, bp: comp ? 3 : 1, comp};
}
function cardN(){
  const {n, comp} = beatsInfo();
  const simple = !comp && pulseQ(pat) === 1 && (!pat.sizes || pat.sizes.every(x => x === 1));
  return simple && SETS[n] ? n : 0;
}

/* ----- desenhar a figura (notação) ----- */
function figureSvg(items, n){
  const o = []; let s = 0;
  items.forEach(d => { o.push({d: Math.abs(d), rest: d < 0, s}); s += Math.abs(d); });
  // espaço de cada figura cresce com a duração, mas sem deixar as colcheias se sobreporem; o conjunto fica centrado
  const w = o.map(it => 7 + 10 * Math.pow(it.d, .7));
  let tot = w.reduce((a, b) => a + b, 0);
  const k = tot > 72 ? 72 / tot : 1; tot *= k;
  let ac = (100 - tot) / 2;
  o.forEach((it, i) => { it.x = ac + w[i] * k / 2 - 2; ac += w[i] * k; });
  const X = it => it.x;
  const beam = new Set();
  for (let i = 0; i < o.length - 1; i++){
    const a = o[i], b = o[i + 1];
    if (!a.rest && !b.rest && a.d === .5 && b.d === .5 && a.s % 1 === 0 && !beam.has(i)){ beam.add(i); beam.add(i + 1); i++; }
  }
  const Y = 66, TOP = 32;
  let g = '';
  o.forEach((it, i) => {
    const x = X(it);
    if (it.rest){
      if (it.d === .5){
        g += `<circle cx="${x - 2}" cy="52" r="2.4" fill="currentColor"/><path d="M${x},53 L${x - 4},72" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;
      } else {
        g += `<path d="M${x - 2},38 L${x + 3},47 L${x - 2},56 L${x + 3},65 Q${x - 4},64 ${x - 1},73" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      return;
    }
    const hollow = it.d >= 2;
    g += `<ellipse cx="${x}" cy="${Y}" rx="5.4" ry="3.8" transform="rotate(-20 ${x} ${Y})" ` +
         (hollow ? 'fill="none" stroke="currentColor" stroke-width="1.8"' : 'fill="currentColor"') + '/>';
    if (it.d !== 4) g += `<line x1="${x + 4.9}" y1="${Y - 1.5}" x2="${x + 4.9}" y2="${TOP}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`;
    if (it.d === 1.5 || it.d === 3) g += `<circle cx="${x + 10}" cy="${Y - 3}" r="1.5" fill="currentColor"/>`;
    if (it.d === .5 && !beam.has(i)){
      g += `<path d="M${x + 4.9},${TOP} C${x + 6},${TOP + 9} ${x + 14},${TOP + 8} ${x + 11},${TOP + 20}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;
    }
  });
  for (let i = 0; i < o.length - 1; i++){
    if (beam.has(i) && beam.has(i + 1) && o[i].d === .5 && o[i + 1].d === .5 && o[i].s % 1 === 0 && Math.abs(o[i + 1].s - o[i].s - .5) < 1e-6){
      g += `<line x1="${X(o[i]) + 4.9}" y1="${TOP}" x2="${X(o[i + 1]) + 4.9}" y2="${TOP}" stroke="currentColor" stroke-width="4" stroke-linecap="butt"/>`;
    }
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
}

/* ----- falar “Tá” (voz do aparelho) ----- */
let speechTimers = [];
function cancelSpeech(){
  speechTimers.forEach(clearTimeout); speechTimers = [];
  try { speechSynthesis.cancel(); } catch(e){}
}
/* sílaba da linguagem rítmica: nota longa = vogal prolongada (Tá, Táá, Tááá, Táááá); colcheia = ti */
function speakSyl(d){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const short = d < 1;
    const u = new SpeechSynthesisUtterance(short ? 'ti' : 'T' + 'á'.repeat(Math.max(1, Math.round(d))));
    u.lang = 'pt-BR'; u.volume = 1;
    // nota mais longa → fala mais devagar, para a vogal durar
    u.rate = short || d <= 1 ? Math.max(1, Math.min(2.2, 0.9 + bpm / 100)) : d >= 3 ? .6 : d >= 2 ? .7 : .85;
    speechSynthesis.speak(u);
  } catch(e){}
}
function speak(txt){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'pt-BR'; u.volume = 1;
    u.rate = Math.max(1, Math.min(2.2, 0.9 + bpm / 100));
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ----- a cada pulso do metrônomo ----- */
function clearNow(){ setCard(-1); }
function showNow(it){
  const {bp} = beatsInfo(), nP = pat.pts.length, p = it.p;
  const n = cardN(), list = n ? pickedBy[n] : [];
  const bar = Math.floor(p / nP);                       // -1 = compasso de contagem
  const card = bar >= 0 && list.length ? list[bar % list.length] : -1;
  setCard(card);
  if (!speakOn) return;
  if (card < 0){                                        // contagem (ou sem figura escolhida): Tá a cada tempo
    if ((((p % bp) + bp) % bp) === 0) speak('Tá');
    return;
  }
  // figura escolhida: fala cada nota na hora certa, com a duração dela; pausas ficam em silêncio
  const pos = p - bar * nP, beatMs = 60000 / bpm;
  let s = 0;
  SETS[n][card].forEach(d => {
    const a = Math.abs(d), st = s; s += a;
    if (d < 0 || st < pos - 1e-6 || st >= pos + 1 - 1e-6) return;
    const delay = (st - pos) * beatMs;
    if (delay < 5) speakSyl(a); else speechTimers.push(setTimeout(() => speakSyl(a), delay));
  });
}

/* ----- telas ----- */
function setView(v){
  if (playing) stop();
  view = v;
  $('tabM').setAttribute('aria-pressed', v === 'metro');
  $('tabS').setAttribute('aria-pressed', v === 'solfa');
  $('scorePanel').hidden = v !== 'solfa';
  // andamento e botão de tocar acompanham a tela
  if (v === 'solfa') $('scorePanel').appendChild($('ctrl'));
  else $('sigs').parentNode.appendChild($('ctrl'));
  if (v === 'solfa') renderScore();
}
$('tabM').onclick = () => setView('metro');
$('tabS').onclick = () => setView('solfa');

$('oSpeak').checked = speakOn;
$('oSpeak').onchange = () => {
  speakOn = $('oSpeak').checked;
  try { localStorage.setItem('maestro.speak', speakOn ? '1' : '0'); } catch(e){}
  if (speakOn) speak('Tá'); else cancelSpeech();
};
if (!('speechSynthesis' in window)) $('lSpeak').hidden = true;

build(); buildSigs(); buildChars(); setBpm(initBpm); requestAnimationFrame(frame);
</script>
